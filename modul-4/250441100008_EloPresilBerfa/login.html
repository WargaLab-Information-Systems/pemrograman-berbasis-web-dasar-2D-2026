<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body class="flex min-h-screen">

    <div class="w-1/2 bg-[#5E7AC4] text-white flex flex-col justify-center items-center p-10">
        <h1 class=" font-semibold text-6xl font-['Poppins'] mb-4 text-left">
            Hello Prospective <br>Student
        </h1>
        <img src="asset/gambar_login page.png" class="h-70 w-96 mb-6">
        <p class="text-left font-medium font-['Poppins'] text-sm max-w-md">
            Unlock your professional potential. Learn from industry leaders and stay ahead of the competition.
        </p>
    </div>

    <div class="w-1/2 bg-gray-100 flex justify-center items-center">
        <div class=" p-8 rounded-lg w-80">
            <h2 class="text-center font-semibold mb-4">LOGIN PAGE</h2>
            <p class="text-xs text-gray-500 text-center mb-4">
                Masukkan Username dan Password Anda
            </p>
            <input type="email" id="email" placeholder="Email"
                class="w-full mb-3 px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400">

            <input type="password" id="password" placeholder="password"
                class=" w-full mb-4 px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400">

            <button id="tombol" class="w-full bg-[#3852B4] text-white py-2 rounded-md hover:bg-blue-500">
                Login
            </button>
            <p class="text-center text-xs text-gray-400 my-3">Or Login With</p>
            <a href="index.html">
                <button id="google"
                    class=" w-full shadow-md py-2 rounded-md flex items-center justify-center gap-2 hover:bg-gray-200">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5">
                    Sign in with Google
                </button>
            </a>
        </div>
    </div>

    <script src="index1.js"></script>
</body>

</html>
